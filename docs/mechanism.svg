<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg     { fill: #1c1c1e; }
    .card   { fill: #2c2c2e; stroke: #3a3a3c; stroke-width: 1; }
    .h1     { fill: #f2f2f7; font-size: 21px; font-weight: 650; }
    .sub    { fill: #98989d; font-size: 13.5px; }
    .step   { fill: #8e8e93; font-size: 11.5px; font-weight: 700; letter-spacing: 1.3px; }
    .dead   { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 19px; fill: #e5e5ea; }
    .live   { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 19px; fill: #ff9f0a; }
    .note   { fill: #aeaeb2; font-size: 13.5px; }
    .keycap { fill: #48484a; stroke: #6c6c70; stroke-width: 1; }
    .keytxt { fill: #f2f2f7; font-size: 11.5px; font-weight: 650; font-family: 'SF Mono', Menlo, monospace; }
    .caret  { stroke: #0a84ff; stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5e"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="480"/>
  <text class="h1"  x="40" y="46">Turning dead text into a real Apple Notes tag</text>
  <text class="sub" x="40" y="70">Nothing is retyped, so non-ASCII tags survive and the note body is never rewritten.</text>

  <text class="step" x="40" y="122">1 · PLACE THE CARET</text>
  <rect class="card" x="40" y="134" width="300" height="58" rx="10"/>
  <text class="dead" x="62" y="170">#旅行</text>
  <line class="caret" x1="122" y1="151" x2="122" y2="180"/>
  <text class="note" x="372" y="156">Right after the tag's last character.</text>
  <text class="note" x="372" y="177">Confirmed by reading AXSelectedTextRange</text>
  <text class="note" x="372" y="195">before a single key is pressed.</text>

  <path d="M 190 198 L 190 234" stroke="#5a5a5e" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text class="step" x="40" y="262">2 · TYPE ONE SPACE</text>
  <rect class="card" x="40" y="274" width="300" height="58" rx="10"/>
  <text class="live" x="62" y="310">#旅行</text>
  <line class="caret" x1="134" y1="291" x2="134" y2="320"/>
  <rect class="keycap" x="248" y="289" width="70" height="27" rx="6"/>
  <text class="keytxt" x="264" y="307">space</text>
  <text class="note" x="372" y="296">The editor's own parser fires and swaps the</text>
  <text class="note" x="372" y="317">text for an inline hashtag object — the only</text>
  <text class="note" x="372" y="335">thing that creates a real tag.</text>

  <path d="M 190 338 L 190 374" stroke="#5a5a5e" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text class="step" x="40" y="402">3 · BACKSPACE</text>
  <rect class="card" x="40" y="414" width="300" height="58" rx="10"/>
  <text class="live" x="62" y="450">#旅行</text>
  <line class="caret" x1="122" y1="431" x2="122" y2="460"/>
  <rect class="keycap" x="248" y="429" width="70" height="27" rx="6"/>
  <text class="keytxt" x="268" y="447">delete</text>
  <text class="note" x="372" y="436">Removes the space that triggered it.</text>
  <text class="note" x="372" y="457">Net edit: zero characters. The tag stays real.</text>
</svg>
